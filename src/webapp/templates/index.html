<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darija Health Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #2a7f62;
    color: white;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header small {
    font-weight: 400;
    font-size: 13px;
    opacity: 0.85;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2a7f62;
    color: white;
    border-bottom-left-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: white;
    color: #222;
    border: 1px solid #ddd;
    border-bottom-right-radius: 4px;
  }
  .bot.emergency {
    border: 2px solid #c0392b;
    background: #fdecea;
  }
  .meta {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
  }
  #inputRow {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: #2a7f62;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #sendBtn:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  #debugToggle {
    font-size: 12px;
    color: white;
  }
  #authPanel {
    width: min(420px, calc(100% - 32px));
    margin: auto;
    padding: 24px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px #0002;
  }
  #authPanel form {
    display: grid;
    gap: 12px;
  }
  #authPanel input, #patientSelect {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  #authError {
    color: #a00;
    min-height: 1.4em;
  }
  #logoutBtn {
    border: 1px solid white;
    background: transparent;
    color: white;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .typing {
    align-self: flex-start;
    color: #888;
    font-size: 13px;
    padding: 6px 14px;
  }
</style>
</head>
<body>

<header>
  <span id="headerTitle">Darija Health Assistant</span>
  <div>
    <label id="debugToggle">
      <input type="checkbox" id="debugCheckbox"> debug
    </label>
    <button id="logoutBtn" hidden>خروج</button>
  </div>
</header>

<section id="authPanel">
  <h2>دخول آمن</h2>
  <form id="loginForm">
    <label for="usernameInput">اسم المستخدم</label>
    <input id="usernameInput" name="username" autocomplete="username" required>
    <label for="passwordInput">كلمة السر</label>
    <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">دخول</button>
  </form>
  <p id="authError" role="alert"></p>
</section>

<select id="patientSelect" hidden aria-label="Patient"></select>
<div id="chat"></div>

<div id="inputRow">
  <input type="text" id="msgInput" autocomplete="off">
  <button id="sendBtn">Send</button>
</div>

<script>
  const AR = {
    headerTitle: "\u0645\u0633\u0627\u0639\u062f \u0627\u0644\u0633\u0643\u0631\u064a",
    placeholder: "\u0627\u0643\u062a\u0628 \u0631\u0633\u0627\u0644\u062a\u0643 \u0647\u0646\u0627...",
    send: "\u0628\u0639\u062b",
    welcome: "\u0623\u0647\u0644\u0627! \u0643\u064a\u0641\u0627\u0634 \u0646\u062c\u0645 \u0646\u0639\u0627\u0648\u0646\u0643 \u0627\u0644\u064a\u0648\u0645\u061f",
    typing: "\u0643\u0627\u062a\u0628...",
    error: "\u0635\u0627\u0631 \u0645\u0634\u0643\u0644 \u062a\u0642\u0646\u064a\u060c \u0639\u0627\u0648\u062f \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629 \u0645\u0646 \u0628\u0639\u062f."
  };

  document.getElementById("headerTitle").textContent = AR.headerTitle;
  document.getElementById("msgInput").placeholder = AR.placeholder;
  document.getElementById("sendBtn").textContent = AR.send;

  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const debugCheckbox = document.getElementById("debugCheckbox");
  const authPanel = document.getElementById("authPanel");
  const loginForm = document.getElementById("loginForm");
  const authError = document.getElementById("authError");
  const logoutBtn = document.getElementById("logoutBtn");
  const patientSelect = document.getElementById("patientSelect");
  let csrfToken = "";
  let currentUser = null;

  function addBubble(text, sender, meta) {
    const b = document.createElement("div");
    b.className = "bubble " + sender;
    if (meta && meta.route === "emergency") {
      b.classList.add("emergency");
    }
    b.textContent = text;
    chatEl.appendChild(b);

    if (meta && debugCheckbox.checked) {
      const m = document.createElement("div");
      m.className = "meta";
      m.style.alignSelf = sender === "user" ? "flex-end" : "flex-start";
      m.textContent = "route=" + meta.route + " | intent=" + meta.intent + " | confidence=" + meta.confidence;
      chatEl.appendChild(m);
    }

    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addTyping() {
    const t = document.createElement("div");
    t.className = "typing";
    t.id = "typingIndicator";
    t.textContent = AR.typing;
    chatEl.appendChild(t);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typingIndicator");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": csrfToken
        },
        body: JSON.stringify({
          message: text,
          ...(currentUser.role === "staff" ? { patient_id: patientSelect.value } : {})
        })
      });
      const data = await resp.json();
      removeTyping();

      if (!resp.ok || data.error) {
        addBubble(AR.error, "bot");
      } else {
        addBubble(data.response, "bot", data);
      }
    } catch (e) {
      removeTyping();
      addBubble(AR.error, "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function refreshCsrfToken() {
    const response = await fetch("/api/auth/csrf");
    const data = await response.json();
    if (!response.ok) throw new Error("Authentication is not configured.");
    csrfToken = data.csrf_token;
  }

  async function showAuthenticatedChat(user) {
    currentUser = user;
    authPanel.hidden = true;
    chatEl.hidden = false;
    document.getElementById("inputRow").hidden = false;
    logoutBtn.hidden = false;
    if (user.role === "staff") {
      const response = await fetch("/api/patients");
      const data = await response.json();
      patientSelect.replaceChildren();
      for (const patientId of data.patient_ids || []) {
        const option = document.createElement("option");
        option.value = patientId;
        option.textContent = patientId;
        patientSelect.appendChild(option);
      }
      patientSelect.hidden = false;
    }
    addBubble(AR.welcome, "bot");
    inputEl.focus();
  }

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    authError.textContent = "";
    try {
      await refreshCsrfToken();
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": csrfToken
        },
        body: JSON.stringify({
          username: document.getElementById("usernameInput").value,
          password: document.getElementById("passwordInput").value
        })
      });
      const data = await response.json();
      if (!response.ok) {
        authError.textContent = data.error || AR.error;
        return;
      }
      csrfToken = data.csrf_token;
      document.getElementById("passwordInput").value = "";
      await showAuthenticatedChat(data);
    } catch (error) {
      authError.textContent = AR.error;
    }
  });

  logoutBtn.addEventListener("click", async function() {
    await fetch("/api/auth/logout", {
      method: "POST",
      headers: { "X-CSRF-Token": csrfToken }
    });
    window.location.reload();
  });

  async function initialize() {
    chatEl.hidden = true;
    document.getElementById("inputRow").hidden = true;
    try {
      await refreshCsrfToken();
      const response = await fetch("/api/auth/me");
      if (response.ok) {
        await showAuthenticatedChat(await response.json());
      }
    } catch (error) {
      authError.textContent = AR.error;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  initialize();
</script>

</body>
</html>
